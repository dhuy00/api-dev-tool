<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - API Forge</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@320;330;340;450;480;540;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    :root {
      --black: #000000;
      --white: #ffffff;
      --canvas: #ffffff;
      --surface-soft: #f7f7f5;
      --hairline: #e5e5e3;

      /* Color blocks */
      --block-lilac: #d6cdff;

      --ink: #000000;

      /* Spacing */
      --space-xs: 8px;
      --space-sm: 12px;
      --space-md: 16px;
      --space-lg: 24px;

      /* Radius */
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 10px;
      --radius-pill: 50px;

      /* Typography */
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', menlo;
      --text-xs: 12px;
      --text-sm: 13px;
      --text-base: 14px;
    }

    [data-theme="dark"] {
      --black: #ffffff;
      --white: #000000;
      --canvas: #0a0a0a;
      --surface-soft: #1a1a1a;
      --hairline: #2a2a2a;
      --ink: #ffffff;
      --block-lilac: #1a1a2e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      font-size: var(--text-base);
      font-weight: 330;
      line-height: 1.5;
      color: var(--ink);
      background: var(--canvas);
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }

    /* Auth layout */
    .auth-page {
      display: flex;
      min-height: 100vh;
    }

    /* Left panel - form */
    .auth-form-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: var(--space-lg);
      max-width: 440px;
      margin: 0 auto;
    }

    /* Logo */
    .logo {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      margin-bottom: var(--space-lg);
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      background: var(--black);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-mark svg {
      width: 18px;
      height: 18px;
      color: var(--white);
    }

    .logo-text {
      font-size: var(--text-base);
      font-weight: 700;
    }

    /* Title */
    .auth-title {
      font-size: 20px;
      font-weight: 540;
      margin-bottom: var(--space-xs);
    }

    .auth-subtitle {
      font-size: var(--text-sm);
      opacity: 0.5;
      margin-bottom: var(--space-lg);
    }

    /* Form */
    .form-group {
      margin-bottom: var(--space-sm);
    }

    .form-label {
      display: block;
      font-size: var(--text-xs);
      font-weight: 450;
      margin-bottom: 4px;
    }

    .form-input {
      width: 100%;
      padding: 10px 12px;
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      font-weight: 330;
      color: var(--ink);
      background: var(--canvas);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-md);
      outline: none;
      transition: border-color 0.15s;
    }

    .form-input::placeholder {
      opacity: 0.4;
    }

    .form-input:focus {
      border-color: var(--black);
    }

    /* Options */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: var(--space-sm) 0;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: var(--text-xs);
      cursor: pointer;
    }

    .checkbox-label input {
      width: 14px;
      height: 14px;
      accent-color: var(--black);
    }

    .link {
      font-size: var(--text-xs);
      font-weight: 480;
      color: var(--ink);
      text-decoration: none;
    }

    .link:hover {
      text-decoration: underline;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 10px;
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      font-weight: 450;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.15s;
      border: none;
    }

    .btn-primary {
      background: var(--black);
      color: var(--white);
    }

    .btn-primary:hover {
      opacity: 0.85;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      margin: var(--space-md) 0;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--hairline);
    }

    .divider-text {
      font-size: var(--text-xs);
      font-family: var(--font-mono);
      opacity: 0.5;
    }

    /* OAuth */
    .oauth-buttons {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .btn-oauth {
      width: 100%;
      padding: 10px;
      background: var(--surface-soft);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      font-weight: 450;
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
    }

    .btn-oauth:hover {
      background: var(--hairline);
    }

    .btn-oauth svg {
      width: 18px;
      height: 18px;
    }

    /* Footer */
    .auth-footer {
      text-align: center;
      margin-top: var(--space-md);
      font-size: var(--text-sm);
    }

    .auth-footer a {
      font-weight: 480;
      color: var(--ink);
    }

    /* Right panel - illustration */
    .auth-visual-side {
      flex: 1;
      background: var(--block-lilac);
      display: none;
    }

    @media (min-width: 900px) {
      .auth-visual-side {
        display: flex;
      }
    }

    /* Theme toggle */
    .theme-toggle {
      position: fixed;
      top: var(--space-md);
      right: var(--space-md);
      width: 32px;
      height: 32px;
      background: var(--surface-soft);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      transition: all 0.15s;
    }

    .theme-toggle:hover {
      background: var(--hairline);
    }

    .theme-toggle svg {
      width: 14px;
      height: 14px;
    }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
    <svg class="icon-sun" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
    </svg>
    <svg class="icon-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display:none">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
    </svg>
  </button>

  <div class="auth-page">
    <!-- Form side -->
    <div class="auth-form-side">
      <div class="logo">
        <div class="logo-mark">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <span class="logo-text">API Forge</span>
      </div>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to continue to your workspace</p>

      <form>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-input" placeholder="you@company.com">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Enter your password">
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" checked>
            Remember me
          </label>
          <a href="#" class="link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary">Sign in</button>
      </form>

      <div class="divider">
        <span class="divider-text">or continue with</span>
      </div>

      <div class="oauth-buttons">
        <button type="button" class="btn-oauth">
          <svg viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </button>

        <button type="button" class="btn-oauth">
          <svg viewBox="0 0 24 24">
            <path fill="currentColor" d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
          </svg>
          Continue with GitHub
        </button>
      </div>

      <p class="auth-footer">
        Don't have an account? <a href="register.html">Create account</a>
      </p>
    </div>

    <!-- Visual side -->
    <div class="auth-visual-side"></div>
  </div>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const sun = document.querySelector('.icon-sun');
      const moon = document.querySelector('.icon-moon');

      if (html.getAttribute('data-theme') === 'dark') {
        html.removeAttribute('data-theme');
        sun.style.display = 'block';
        moon.style.display = 'none';
      } else {
        html.setAttribute('data-theme', 'dark');
        sun.style.display = 'none';
        moon.style.display = 'block';
      }
    }
  </script>
</body>
</html>
